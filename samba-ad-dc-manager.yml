# active-profiles: debian,eureka-client,springdoc,api,jwt,ldap-auth,remember-me,mail,dc1|dc2
springdoc:
  open-api:
    # see: https://github.com/OAI/OpenAPI-Specification/blob/3.1.1/versions/3.1.1.md#info-object
    servers:
      - url: '{cipher}aa3ffde3282c4a72448f7c0d5819a4872917ee18bfb54c80ae40f85491277fbe7092c31db8460154eb36e9c697a11d3a7f0343462e7e0db93c871f02b9fa741aca1db14fa3783243725a675226be6802'
        description: Samba AD DC Manager API

bremersee:
  dc:
    base-dn: '{cipher}3ef30fc3a508299fe01a9beb3888c89797df70a2be18d1457f5f7db88c7ac1ebb6c8ddc43da38260d3e4d314e31fa2db'
    company-name: '{cipher}2be0555b91391985a553c8bfd89e8daf36d247aaca98d1fe316d843dbc118e6e'
    company-url: '{cipher}f54dca82fb946bcb1f12bd8f35a5f6bca559d483dfcffc36ca7b377b150dab49c6c0b1298a732ba8dfcadace59a24eec'
    crypto-secret: '{cipher}c43fb78c83ccf00d95e5782a7114931ba09cdeb20c396469e4200f52cfd97be14c053ee19e83fec9f1cf72aa3ff8b5dddee40ca3c2b37271415d95291c12348f86385d77f76e10ccc2beab542d9c9e16'
    cli:
      hostname-binary: /usr/bin/hostname
      samba-tool-binary: /usr/bin/samba-tool
      samba-tool-credentials-options: -UAdministrator --password=${bremersee.ldaptive.bind-credentials}
      dhcp-lease-list-binary: /usr/sbin/dhcp-lease-list
      sudo:
        using-sudo: true
      ssh:
        using-ssh: false
    domain:
      forbidden-new-sam-account-names:
        - "root"
        - "admin"
        - "guest"
    user:
      user-able-to-change-email: true
      default-language: "de-DE"
      default-login-page:
        url: '{cipher}ed9ef8c80c87ccf9a66ada0626586484629c01715f4fe3fa4b77c7569390bb7e2f4d29a3d502908acf4c983c6ce1e386'
        name: '{cipher}1a41d99804a13eefbf3f17898a6a3aa4b158f6834e125ec016248e8d604f4864'
        using-netbios-domain-prefix: true
    email:
      sender: '{cipher}7eff606ddc4846645cc057ecab18747d859abcdbe2184519a6b23c3f744e80b00d7bba37d8e6132b9e7e6a94393c027a'
      base-uri: '{cipher}f54dca82fb946bcb1f12bd8f35a5f6bca559d483dfcffc36ca7b377b150dab49c6c0b1298a732ba8dfcadace59a24eec'
  ldaptive:
    ldaptive-template-class: org.bremersee.ldaptive.LdaptiveSambaTemplate
    immutable: true
    use-start-tls: false
    bind-dn: '{cipher}c8f0d20bfdb6087083ec1a18eee507806622e50c9da2b2295977b8207f2fe0668aef89b99ed2d3746834064cc62d733723ca2ab70d44ddf7062d2ee51221af6f'
    bind-credentials: '{cipher}4fbefa96ef0e671c9530dbab12e88b79af071b6015bb93aba7550ce75f487651dde9322730f217a9ddee35c0e5a5cf2b'
    pooled: true
    connection-validator:
      search-request:
        base-dn: ${bremersee.dc.base-dn}
    connection-pool:
      min-pool-size: 3
      max-pool-size: 10
      validate-on-check-in: false
      validate-on-check-out: false
      validate-periodically: true
      validator:
        search-request:
          base-dn: ${bremersee.dc.base-dn}

---

spring:
  config:
    activate:
      on-profile: dc1

bremersee:
  ldaptive:
    ldap-url: ldaps://${bremersee.dc1}

eureka:
  instance:
    hostname: ${bremersee.dc1}
    ip-address: 192.168.1.3

---

spring:
  config:
    activate:
      on-profile: dc2

bremersee:
  ldaptive:
    ldap-url: ldaps://${bremersee.dc2}

eureka:
  instance:
    hostname: ${bremersee.dc2}
    ip-address: 192.168.1.4
