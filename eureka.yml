spring:
  jmx:
    enabled: true

eureka:
  server:
    enable-self-preservation: true
  instance:
    instance-id: ${spring.application.name}:${eureka.instance.hostname}
    prefer-ip-address: false
    non-secure-port: 8761
    non-secure-port-enabled: true
    registry:
      expected-number-of-clients-sending-renews: 2
    metadata-map:
      user.name: ${bremersee.actuator.username}
      user.password: ${bremersee.actuator.password}
  client:
    enabled: true
    register-with-eureka: true
    fetch-registry: true

server:
  port: 8761

---

spring:
  config:
    activate:
      on-profile: app1

eureka:
  client:
    service-url:
      defaultZone: "http://${bremersee.eureka.username}:${bremersee.eureka.password}@app2.eixe.bremersee.org:8761/eureka/,\
        http://${bremersee.eureka.username}:${bremersee.eureka.password}@data.eixe.bremersee.org:8761/eureka/"
  instance:
    hostname: app1.eixe.bremersee.org
    ip-address: 192.168.1.51

---

spring:
  config:
    activate:
      on-profile: app2

eureka:
  client:
    service-url:
      defaultZone: "http://${bremersee.eureka.username}:${bremersee.eureka.password}@app1.eixe.bremersee.org:8761/eureka/,\
        http://${bremersee.eureka.username}:${bremersee.eureka.password}@data.eixe.bremersee.org:8761/eureka/"
  instance:
    hostname: app2.eixe.bremersee.org
    ip-address: 192.168.1.52

---

spring:
  config:
    activate:
      on-profile: data

eureka:
  client:
    service-url:
      defaultZone: "http://${bremersee.eureka.username}:${bremersee.eureka.password}@app1.eixe.bremersee.org:8761/eureka/,\
        http://${bremersee.eureka.username}:${bremersee.eureka.password}@app2.eixe.bremersee.org:8761/eureka/"
  instance:
    hostname: data.eixe.bremersee.org
    ip-address: 192.168.1.8
