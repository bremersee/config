spring:
  jmx:
    enabled: true

bremersee:
  keycloak:
    admin-client:
      enabled: true

springdoc:
  open-api:
    # see: https://github.com/OAI/OpenAPI-Specification/blob/3.1.1/versions/3.1.1.md#info-object
    servers:
      - url: https://apps.eixe.bremersee.org/groupman
        description: Group Manager API

---

spring:
  config:
    activate:
      on-profile: app1

eureka:
  instance:
    hostname: app1.eixe.bremersee.org
    ip-address: 192.168.1.51

---

spring:
  config:
    activate:
      on-profile: app2

eureka:
  instance:
    hostname: app2.eixe.bremersee.org
    ip-address: 192.168.1.52
